[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "awq-checkpoint-surgery"
version = "0.1.0"
description = "Inspect, verify and shrink 4-bit AWQ checkpoints (compressed-tensors pack-quantized)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["torch>=2.1", "safetensors>=0.4", "numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8.0", "numpy>=1.24"]

[tool.setuptools]
packages = ["awq_surgery"]

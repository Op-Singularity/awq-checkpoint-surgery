name: tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: [ '3.10', '3.12' ]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # CPU-only torch keeps the download small; the packing code never needs a GPU
      - name: Install CPU torch
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Install package
        run: pip install safetensors pytest numpy && pip install -e .

      - name: Unit tests
        run: python -m pytest tests/ -v

      - name: The synthetic round trip must be exercised
        run: python -m pytest tests/ -v -k "not real_checkpoint"

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install CPU torch
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Install package
        run: pip install safetensors numpy && pip install -e .

      # the commands the README shows must exist and do something
      - name: Documented subcommands exist
        run: |
          set -euo pipefail
          python -m awq_surgery.surgery --help | tee help.txt
          grep -q "inspect" help.txt
          grep -q "strip" help.txt

      - name: inspect works on a synthetic checkpoint
        run: python -m pytest tests/test_inspect_cli.py -v

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every file mentioned in the README exists
        run: |
          set -euo pipefail
          missing=0
          # repo-relative paths the README points at
          for f in awq_surgery/packing.py tests/test_packing.py README.md LICENSE; do
            if [ ! -e "$f" ]; then echo "missing: $f"; missing=1; fi
          done
          exit $missing
      - name: Source files parse as Python 3
        run: python -m compileall -q awq_surgery tests && echo "ok"
